<text x="520" y="1008.28" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="27" fill="#000000" text-anchor="middle">Compute F_gross = B + max(0, D - D_base)</text>
<text x="520" y="1043.38" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="27" fill="#000000" text-anchor="middle">x R</text>
